# Tent (paper-faithful baseline for the continual benchmark): entropy
# minimisation on the adapted model + a marginal anti-collapse term
# -lambda2*H(f-bar) (marginal_lambda=0.2) that the source paper applies to every
# method (tent.py: `loss -= alpha[0]*softmax_mean_entropy`). Adam lr=1e-3,
# CONSTANT LR (no warm-up; warmup_K=0), per the paper/code.
name: tent
score: null
gmm_fit: none
ood_op: none
label: soft
lr: 1.0e-3
lam: 0.03
marginal_lambda: 0.2
warmup_K: 0
frozen: false
