# BN-adapt: the shared t=0 baseline. The adapter never updates theta -- its
# `.step` is a no-op (frozen=True), so the trajectory is flat at theta_0. The
# only thing that varies per batch is the current-batch BN statistic.
# All other axes are inert in this mode.
name: bnadapt
score: null
gmm_fit: none
ood_op: none
label: soft
lr: 1.0e-3
lam: 0.03
warmup_K: 10
frozen: true
