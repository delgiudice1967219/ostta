defaults:
  - method: tent          
  - _self_

corruption: gaussian_noise   
severity: 5
ood_source: svhn_c           
N: 200                       # stream batch size (open-set => N//2 csID + N//2 csOOD)
T: 80                        # adaptation steps
seed: 0                      # drives the pool split AND the frozen stream order

n_diag: 2000                 # held-out diagnostic count, per source

batch_size: 200              # diagnostic eval mini-batch (mixed: //2 ID + //2 OOD)
device: cpu                  # cpu | cuda
out_dir: null                
n_examples: 10000
n_ood_examples: null

alpha: 0.5                   # open-set OOD fraction per batch (n_ood = round(alpha*N))
dump_per_sample: false       # also dump per-sample energy + L2 norm (distribution figure)
dump_features: false         # also dump penultimate embeddings + labels (t-SNE figure)

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}_${method.name}_${corruption}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${method.name}_${corruption}
