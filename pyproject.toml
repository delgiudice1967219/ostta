[project]
name = "open-set-tta"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "torch", "torchvision", "robustbench @ git+https://github.com/RobustBench/robustbench.git",
  "scikit-learn", "numpy", "matplotlib", "scipy", "tqdm",
  "hydra-core", "omegaconf",
  "imagecorruptions>=1.1.2",
]
[project.optional-dependencies]
dev = ["pytest"]

[tool.uv]
package = false        

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
